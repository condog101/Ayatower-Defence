<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Ayatower Defence</title>
    <meta name="description" content="Ayatower Defence: You Shah-ll not pass! A satirical tower defence in the Strait of Hormuz, starring the Grey Turban and Big Don." />
    <link rel="icon" href="assets/sprites/advisory.png" />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        overflow: hidden;
        font-family: 'Press Start 2P', monospace;
      }
      /* Inset by the safe areas so the canvas (HUD, arrow pad) stays out from under the notch and home bar. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
      canvas { image-rendering: pixelated; }
      html, body, #game, canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000000;
        color: #ffd84a;
        font-size: 14px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
      }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 700px) {
        #rotate { display: flex; }
      }
      #login {
        position: fixed;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: min(420px, 86vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
        color: #f3ead7;
        font-size: 12px;
      }
      #login[hidden] { display: none; }
      /* The heading only shows on phones; on desktop the canvas panel carries the title. */
      #login .title { display: none; color: #ffd84a; font-size: 14px; text-align: center; }
      #login label { display: flex; flex-direction: column; gap: 8px; }
      #login .fields { display: flex; flex-direction: column; gap: 14px; }
      #login input {
        font: inherit;
        font-size: 16px;
        padding: 10px;
        background: #000000;
        color: #ffd84a;
        border: 2px solid #8c8577;
        outline: none;
      }
      #login input:focus { border-color: #ffd84a; }
      #login .row { display: flex; gap: 10px; }
      #login button {
        flex: 1;
        font: inherit;
        font-size: 11px;
        padding: 10px 6px;
        background: #141210;
        color: #f3ead7;
        border: 2px solid #8c8577;
        cursor: pointer;
      }
      #login button:hover, #login button:focus { border-color: #ffd84a; color: #ffd84a; }
      #login .msg { font-size: 9px; line-height: 1.6; color: #8c8577; min-height: 3em; }
      #login .msg.error { color: #ff4a4a; }
      /* Touch UI (Device.ts TOUCH, set as a class by Login.ts): a self-contained card pinned to the top,
         so the soft keyboard in landscape never covers the inputs. */
      #login.touch {
        top: 6px;
        transform: translateX(-50%);
        width: min(560px, 94vw);
        box-sizing: border-box;
        gap: 8px;
        padding: 12px;
        background: #0b0a08;
        border: 2px solid #ffd84a;
      }
      #login.touch .title { display: block; }
      #login.touch .fields { flex-direction: row; gap: 10px; }
      #login.touch .fields label { flex: 1; min-width: 0; }
      #login.touch label { gap: 4px; font-size: 10px; }
      #login.touch input { padding: 6px; border-color: #f3ead7; width: 100%; box-sizing: border-box; }
      #login.touch input:focus { border-color: #ffd84a; }
      #login.touch button { min-height: 44px; padding: 6px; font-size: 12px; }
      #login.touch .msg { min-height: 0; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div>ROTATE YOUR PHONE<br /><span style="color:#8c8577;font-size:10px">AYATOWER DEFENCE PLAYS SIDEWAYS</span></div></div>
    <form id="login" hidden autocomplete="off">
      <div class="title">JOIN THE GUARD</div>
      <div class="fields">
        <label>CALLSIGN
          <input name="callsign" maxlength="16" minlength="3" pattern="[A-Za-z0-9_ ]{3,16}" required spellcheck="false" />
        </label>
        <label>4-DIGIT PIN
          <input name="pin" type="password" inputmode="numeric" maxlength="4" minlength="4" pattern="[0-9]{4}" required />
        </label>
      </div>
      <div class="row">
        <button type="submit" data-action="login">SIGN IN</button>
        <button type="submit" data-action="register">REGISTER</button>
      </div>
      <div class="row"><button type="button" data-action="cancel">CANCEL</button></div>
      <div class="msg"></div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
